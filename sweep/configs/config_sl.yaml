# WandB Sweep Configuration - ONEHOT positional encoding only
program: sweep/train.py
project: ricochet-robots-node-classifier-onehot-subgoal-label
method: bayes

metric:
  name: val_exact_match
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 2
  s: 2

parameters:
  # Task configuration
  task_name:
    value: subgoal_label

  # Fixed: onehot encoding (no encoding_dim or combine_method needed)
  positional_encoding:
    value: onehot

  # Model architecture
  nhead:
    values: [4, 8, 16]

  num_layers:
    min: 6
    max: 24
    distribution: int_uniform

  dim_feedforward:
    values: [512, 1024, 2048]

  dropout:
    min: 0.0
    max: 0.3
    distribution: uniform

  # Training hyperparameters
  max_lr:
    min: 0.0001
    max: 0.01
    distribution: log_uniform_values

  weight_decay:
    min: 0.001
    max: 0.3
    distribution: log_uniform_values

  warmup_epochs:
    min: 20
    max: 50
    distribution: int_uniform

  # Fixed or searched
  epochs:
    value: 100

  d_model:
    values: [128, 256]

  batch_size:
    values: [256, 512]

  gradient_clip_val:
    value: 1.0

  # Checkpoint directory
  checkpoint_dirpath:
    value: ./tmp/checkpoints/sl_onehot

  # Dummy values (required by train.py but unused for onehot)
  encoding_dim:
    value: 128
  combine_method:
    value: joint

run_cap: 100  # Half of total budget
