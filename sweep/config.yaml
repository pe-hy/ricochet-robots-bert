# WandB Sweep Configuration
# All trials automatically logged to WandB

program: sweep/train.py
project: ricochet-robots-node-classifier
method: bayes

metric:
  name: val_exact_match
  goal: maximize

# Early stopping with pruning
early_terminate:
  type: hyperband
  min_iter: 30
  eta: 3
  s: 2

# Search space
parameters:
  positional_encoding:
    values: ['onehot', 'learned']

  encoding_dim:
    values: [64, 128, 256]

  combine_method:
    values: ['joint', 'additive']

  nhead:
    values: [4, 8, 16]

  num_layers:
    min: 6
    max: 24
    distribution: int_uniform

  dim_feedforward:
    values: [512, 1024, 2048]

  dropout:
    min: 0.0
    max: 0.3
    distribution: uniform

  max_lr:
    min: 0.0001
    max: 0.01
    distribution: log_uniform_values

  weight_decay:
    min: 0.001
    max: 0.3
    distribution: log_uniform_values

  warmup_epochs:
    min: 20
    max: 50
    distribution: int_uniform

  # Fixed or searched
  epochs:
    value: 150

  d_model:
    values: [128, 256]    # Search over 2 values

  batch_size:
    values: [256, 512]    # Search over 2 values

  gradient_clip_val:
    value: 1.0            # Fixed

run_cap: 500  # Total trials across all workers
