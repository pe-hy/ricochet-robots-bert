# @package _global_

# Hydra configuration for Ricochet Robots Node Classifier
# Usage: python train_node_classifier.py [options]
# Override: python train_node_classifier.py trainer.epochs=50 training.max_lr=2e-3

defaults:
  - _self_
  - task: subgoal_label

# Random seed for reproducibility
seed: 42

# Weights & Biases configuration
wandb:
  project: ricochet-robots-node-classifier
  name: "${task.name}_d${model.d_model}_l${model.num_layers}_h${model.nhead}_lr${training.max_lr}_e${data.positional_encoding}"
  save_dir: ./tmp/wandb_logs
  log_model: false

# Data configuration
data:
  train_path: data/ricochet_data/dataset_multiple_graphs.json
  board_size: 16
  batch_size: 256
  num_workers: 4

  # Split configuration (absolute numbers)
  val_size: 256      # Number of examples for validation
  test_size: 2048     # Number of examples for test (0 = no test set)

  # Positional encoding
  positional_encoding: onehot  # Options: onehot, sinusoidal, normalized, learned
  positional_encoding_kwargs: {}
  # positional_encoding_kwargs: {encoding_dim: 128, combine_method: joint}

# Model architecture
model:
  d_model: 256
  nhead: 8
  num_layers: 16
  dim_feedforward: 1024
  dropout: 0.1
  activation: gelu

# Training configuration
training:
  max_lr: 0.005
  weight_decay: 0.1
  warmup_epochs: 20
  pos_weight: 1  # Equal weighting, no auto-computation (null would auto-compute)
  log_predictions: true

# PyTorch Lightning Trainer
trainer:
  epochs: 100
  accelerator: auto
  devices: auto
  strategy: auto
  precision: bf16-mixed
  log_every_n_steps: 50
  val_check_interval: 1.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  deterministic: false
  benchmark: true

# Checkpoint configuration
checkpoint:
  dirpath: ./tmp/checkpoints/d${model.d_model}_l${model.num_layers}_h${model.nhead}_n${get_num_examples:${data.train_path}}_lr${training.max_lr}_bs${data.batch_size}e${data.positional_encoding}
  filename: "epoch={epoch}-{val_exact_match:.4f}"
  monitor: val_exact_match
  mode: max
  save_top_k: 3
  save_last: true
  auto_insert_metric_name: false

# Early stopping
early_stopping:
  enabled: false
  monitor: val_exact_match
  patience: 10
  mode: max

# Test set evaluation (supports multiple test sets)
test_evaluation:
  enabled: true
  threshold: 0.5
  # List of test sets to evaluate
  test_sets:
    - name: iid
      path: data/ricochet_data/test_multiple_iid.json
      output_path: ./tmp/predictions/test_iid_predictions.pkl
    - name: ood
      path: data/ricochet_data/test_multiple_ood.json
      output_path: ./tmp/predictions/test_ood_predictions.pkl

# Hydra configuration
hydra:
  run:
    dir: ./tmp/hydra
  sweep:
    dir: ./tmp/hydra/sweep/
    subdir: "sub"
